# dast.yaml の例 — 診断対象リポジトリのルートにコピーして調整する。
# 認証情報はここに書かず、環境変数の「名前」だけを参照する。

target:
  base_url: http://localhost:3000
  allowed_hosts:
    - localhost
    - 127.0.0.1
  source_roots:
    - src

zap:
  api_url: http://localhost:8080
  # 既定はキーなし。非ローカルのホストにはキーが必須（ここで指定した名前の環境変数を設定する）。
  api_key_env: ZAP_API_KEY

  # ZAP が未起動のとき、スキルがローカルZAPを起動するか（既定 true）。
  # 起動は必ず 127.0.0.1 に限定。見つからない/失敗時は手動起動を案内（fail-soft）。
  # スキルが起動したインスタンスだけを診断後に停止する。
  autostart: true
  # 任意: 起動コマンドを明示指定（0.0.0.0 バインドは拒否）。
  # start_command: "zap.sh -daemon -host 127.0.0.1 -port 8080 -config api.disablekey=true"
  # 任意: バイナリの代わりに Docker イメージで起動する。
  # docker: "ghcr.io/zaproxy/zaproxy:stable"

authentication:
  enabled: false          # true で認証付きDAST（工程2.5で認証設定＋差分確認）
  # auto はLLMが対象を解析して具体方式へ解決する（zap_auth.py には auto を渡さない）。
  method: auto            # auto | browser | form | json | basic | script
  login_url: /login
  # 認証情報の値は書かない — 環境変数の「名前」だけを指定する。
  # 単一アカウント：
  username_env: DAST_USERNAME
  password_env: DAST_PASSWORD
  # 複数アカウント（認可系の診断に必要）：同一ロール2＝水平／異ロール＝垂直／3＝両方。
  # users を書くと username_env/password_env より優先される。値は書かず環境変数名のみ。
  # users:
  #   - { label: alice, role: user,  username_env: DAST_ALICE_USER, password_env: DAST_ALICE_PASS }
  #   - { label: bob,   role: user,  username_env: DAST_BOB_USER,   password_env: DAST_BOB_PASS }
  #   - { label: admin, role: admin, username_env: DAST_ADMIN_USER, password_env: DAST_ADMIN_PASS }
  max_attempts: 3        # ログイン試行の上限（ロックアウト回避）
  verification:          # 「本当に認証できたか」を差分で確認する（工程2.5・安全の急所）
    # 実際の検証戦略は工程2.5でLLMが決め、zap_auth.py configure-verification --strategy
    # （POLL_URL 推奨）で反映する。ここの method は方針メモで、そのままZAPへは渡らない。
    method: auto         # auto | url | indicator
    logged_in_indicator:    # 任意。LLMが導出してもよい
    logged_out_indicator:
    verification_url:       # 認証後にのみ到達できるURL
  session_management:
    method: auto         # auto | cookie | header | script
  # 認証付き Active Scan の追加ゲート。scan.active_scan と AND、かつ工程5のゲート条件充足で実行。
  active_scan: true      # 既定ON。scan.active_scan と AND。対話確認は取らない

scan:
  # spider / playwright は予約キー。Spider（工程3）は常時実行し、Playwright（工程4/6）の可否は
  # 工程0の playwright チェックで決まるので、false にしても工程はスキップされない。
  spider: true
  ajax_spider: false      # ZAPが Firefox を起動する（必須依存。READMEの前提条件を参照）
  playwright: true
  active_scan: true       # 既定ON。実行時は工程5のゲート条件を満たせば無確認で実行
  scenario_tests: true
  destructive: true       # 対象アプリ内部の破壊的検証。既定ON（使い捨てローカル対象前提）。
                          # 制御するのは LLM主導の工程4・6のみ。非ローカル＋allow_production:false は拒否。
                          # false で工程4・6は検出止まりに戻る。ただし Active Scan(工程5)/Spider(工程3)は
                          # 本質的に破壊的でこのフラグとは独立（active_scan を切らない限り破壊しうる）。
                          # 外部副作用（外部メール/課金/外部SSRF等）はこのフラグでも常に禁止。
  availability_impact: false  # DoS相当・可用性を損なう検証。別軸で既定OFF。

safety:
  require_local_target: true
  allow_production: false

exclude:
  paths:                  # Spider / Ajax / Passive / Active / Playwright に適用
    - /logout
    - /admin/delete-all
    - /api/reset

output:
  directory: reports/dast
