# dast.yaml — 診断対象リポジトリのルートに置く（任意）。
# Skill がこれを読み込む。値はプラグインに固定で埋め込まれない。
# 認証情報そのものはここに書かない — 環境変数の「名前」だけを指定する。

target:
  base_url: http://localhost:3000

  allowed_hosts:
    - localhost
    - 127.0.0.1

  source_roots:
    - src

zap:
  api_url: http://localhost:8080

  # APIキーは既定では不要（キーなし運用）。
  # ただし zap.api_url または target.base_url のホストが
  # localhost / 127.0.0.1 / ::1 以外の場合、キーなし運用は拒否される。
  # キーを使う場合は、値そのものは書かず環境変数名を指定する。
  api_key_env: ZAP_API_KEY

  # ZAP が未起動のとき、スキルがローカルZAPを起動するか（既定 true）。
  # 起動は必ず 127.0.0.1 に限定。ZAPが見つからない/起動失敗時は
  # 手動起動を案内してスキップ（fail-soft）。既に起動済みのZAPには触れない。
  # スキルが起動したインスタンスだけを診断後に停止する。
  autostart: true
  # 任意: 起動コマンドを明示（0.0.0.0 バインドは拒否）。
  # start_command: "zap.sh -daemon -host 127.0.0.1 -port 8080 -config api.disablekey=true"
  # 任意: バイナリの代わりに Docker イメージで起動。
  # docker: "ghcr.io/zaproxy/zaproxy:stable"

# 認証付きDAST（認証できなければ run 停止）。enabled: true で工程2.5が認証を設定し、差分で「本当に
# 認証できたか」を確認してから認証後の探索/スキャン/シナリオ診断へ進む。
# primary は ZAP Browser Based Authentication（要 ZAP 2.16.1+）。ZAP が扱えないログイン
# フロー向けに Playwright ログインを fallback とする（fallback は自動再認証を持たない）。
# 認証情報の値はここに書かない — 環境変数の「名前」だけを指定する。
authentication:
  enabled: false
  # auto はLLMが対象（ソース/画面/DOM/HTTP履歴）を解析して具体方式へ解決する。
  # zap_auth.py には解決済みの具体方式のみを渡す（auto は渡さない）。
  method: auto           # auto | browser | form | json | basic | script
  login_url: /login
  # --- アカウント（単一 or 複数）---
  # 単一アカウント：下記 username_env/password_env を使う。
  username_env: DAST_USERNAME
  password_env: DAST_PASSWORD
  # 複数アカウント：認可系の診断範囲はアカウント構成で決まる。
  #   水平IDOR/水平権限昇格 → 同一ロールを2つ / 垂直権限昇格 → 異なるロール（低権限＋管理者）/
  #   両方を綺麗にやるなら3つ（同一ロール2＋管理者）。role はLLMが対象ごとに選定する。
  # users を書くと username_env/password_env より優先。値は書かず環境変数「名」のみ。
  # users:
  #   - label: alice
  #     role: user
  #     username_env: DAST_ALICE_USER
  #     password_env: DAST_ALICE_PASS
  #   - label: bob
  #     role: user
  #     username_env: DAST_BOB_USER
  #     password_env: DAST_BOB_PASS
  #   - label: admin
  #     role: admin
  #     username_env: DAST_ADMIN_USER
  #     password_env: DAST_ADMIN_PASS
  max_attempts: 3        # ログイン試行の上限（ロックアウト回避）
  verification:          # 工程2.5の差分確認。甘いと「匿名なのに認証成功」と誤合格する
    method: auto         # auto | url | indicator
    logged_in_indicator:
    logged_out_indicator:
    verification_url:
  session_management:
    method: auto         # auto | cookie | header | script
  # 認証付き Active Scan の追加ゲート。scan.active_scan と AND、かつ工程5の明示確認が必要。
  active_scan: true      # 既定ON

scan:
  spider: true
  ajax_spider: false      # ZAPが Firefox を起動する（必須依存。READMEの前提条件を参照）
  playwright: true
  active_scan: true
  scenario_tests: true
  # 破壊的検証（対象アプリ内部の不可逆な状態変更＝削除・更新・実権限昇格など）。
  # このフラグが制御するのは LLM主導の工程4・6のみ。使い捨てローカル対象を前提に既定ON。
  # 非ローカル対象＋allow_production:false では拒否される。false にすると工程4・6は
  # 検出止まり（悪用・状態変更は要人間）。
  # 注意1：Active Scan（工程5）と Spider（工程3）は本質的に破壊的で、このフラグとは独立。
  #        active_scan を切らない限り destructive:false でも破壊しうる。
  # 注意2：外部メール/課金/外部登録/実在内部インフラSSRF等（サンドボックス外への副作用）は
  #        このフラグに関係なく常に禁止。可用性を損なう検証は availability_impact 側で制御する。
  destructive: true
  # 可用性・DoS相当（重いtime-based・大量負荷）。別軸で既定OFF（run途中でアプリが落ちると
  # 以降のカバレッジを失うため）。レート確認の小さなバーストはこれに含まれない。
  availability_impact: false

safety:
  require_local_target: true
  allow_production: false

exclude:
  # 除外は Spider / Ajax Spider / Passive / Active / Playwright の全経路に適用する。
  paths:
    - /logout
    - /admin/delete-all
    - /api/reset

output:
  directory: reports/dast
